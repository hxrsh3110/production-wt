version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: apexfit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apexfit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/apexfit_production_db
      - API_SECRET_KEY=Bearer apexfit-secret-key-2026
      - CORS_ORIGIN=*
    depends_on:
      - mongodb

volumes:
  mongo-data:
